/**:
  controller_manager:
    ros__parameters:
      update_rate: 100 #Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      joint_group_controller:
        type: position_controllers/JointGroupPositionController

      d1_arm_controller:
        type: position_controllers/JointGroupPositionController

  joint_group_controller:
    ros__parameters:
      joints:
        - rf_hip_joint
        - rf_upper_leg_joint
        - rf_lower_leg_joint
        - lf_hip_joint
        - lf_upper_leg_joint
        - lf_lower_leg_joint
        - rh_hip_joint
        - rh_upper_leg_joint
        - rh_lower_leg_joint
        - lh_hip_joint
        - lh_upper_leg_joint
        - lh_lower_leg_joint

  # D1-Tアーム(背面搭載)用。脚の歩行制御(joint_group_controller)とは別系統。
  # 関節順はSDK付属config(joint_names_d1_550_description.yaml)のcontroller_joint_namesに合わせている。
  d1_arm_controller:
    ros__parameters:
      joints:
        - d1_joint1
        - d1_joint2
        - d1_joint3
        - d1_joint4
        - d1_joint5
        - d1_joint6
        - d1_joint_l
        - d1_joint_r
